---
modules-search: [ /usr/lib/neuros-installer/modules, local ]
branding: NeurOS
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
sequence:
  - show: [ welcome, locale, keyboard, partition, users, summary ]
  - exec: [ neurospreflight, partition, mount, unpackfs, neuroscleanup, machineid, fstab, locale, keyboard, localecfg, users, displaymanager, networkcfg, hwclock, services-systemd, neurosboot, umount ]
  - show: [ finished ]
